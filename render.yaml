services:
  # ── Backend (Flask + PyTorch) ──────────────────────────
  - type: web
    name: han-seg-backend
    runtime: python
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MODEL_URL
        value: "REPLACE_WITH_YOUR_MODEL_DOWNLOAD_URL"

  # ── Frontend (Static HTML/CSS/JS) ─────────────────────
  - type: web
    name: han-seg-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "No build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache